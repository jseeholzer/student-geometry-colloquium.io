<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive - Student Geometry Seminar</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Helvetica', 'Arial', 'sans-serif'],
                        serif: ['Georgia', 'Cambria', '"Times New Roman"', 'Times', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 font-serif antialiased leading-relaxed flex flex-col min-h-screen">

    <!-- Top Navigation -->
    <nav class="bg-white border-b border-slate-300">
        <div class="max-w-4xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <a href="index.html" class="font-bold text-lg tracking-tight hover:text-red-800 transition-colors">
                    [University/Department] Geometry Seminar
                </a>
                <div class="hidden sm:flex space-x-6 text-sm font-sans">
                    <a href="index.html" class="text-slate-600 hover:text-red-800 transition-colors">Overview</a>
                    <a href="archive.html" class="text-red-800 font-semibold border-b border-red-800 pb-0.5">Archive</a>
                    <a href="guidelines.html" class="text-slate-600 hover:text-red-800 transition-colors">Call for Talks</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-12 flex-grow w-full">
        
        <h1 class="text-3xl font-bold border-b-2 border-slate-900 pb-2 mb-8">Past Talks Archive</h1>

        <div class="bg-white border border-slate-300 rounded-sm">
            <ul class="divide-y divide-slate-200">
                
                <!-- Archive Item Template -->
                <li class="p-5 sm:p-6 hover:bg-slate-50 transition-colors">
                    <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
                        <div class="space-y-1">
                            <div class="font-sans text-xs text-slate-500 uppercase tracking-wider mb-2">
                                [Date] &bull; [Speaker Name]
                            </div>
                            <h3 class="text-lg font-bold text-slate-900">
                                [Past Talk Title]
                            </h3>
                            <p class="text-sm text-slate-600 mt-1">[Short 1-sentence description or subtitle of the talk.]</p>
                        </div>
                        <div class="shrink-0 font-sans mt-2 sm:mt-0">
                            <!-- Update href with actual link to your PDF file -->
                            <a href="[Link-To-File.pdf]" class="text-sm text-red-800 border border-red-800 hover:bg-red-800 hover:text-white px-3 py-1.5 rounded-sm transition-colors">
                                PDF Notes
                            </a>
                        </div>
                    </div>
                </li>
                <!-- End of Archive Item Template -->

            </ul>
        </div>
    </main>

    <footer class="border-t border-slate-300 mt-12 py-8 text-center text-sm font-sans text-slate-500 bg-slate-50">
        &copy; 2026 [University/Department]. Typeset with KaTeX.
    </footer>
</body>
</html>
